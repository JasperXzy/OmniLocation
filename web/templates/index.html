<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniLocation Control</title>
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap-icons/bootstrap-icons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/leaflet/leaflet.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/design_system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body data-bs-theme="dark">

<div class="container py-5">
    <h1 class="mb-4 text-center">OmniLocation Controller</h1>

    <div class="row g-4 mb-4">
        <!-- Device Selection -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Device Pool</h5>
                    <button class="btn btn-sm btn-outline-primary" id="refresh-devices-btn">
                        <span class="spinner-border spinner-border-sm d-none me-1" id="refresh-devices-spinner" role="status"></span>
                        Scan
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th class="th-checkbox">
                                    <input type="checkbox" id="select-all-checkbox" aria-label="Select all devices">
                                </th>
                                <th>Name</th>
                                <th class="device-type-col">Device Type</th>
                                <th class="connection-col">Connection</th>
                            </tr>
                            </thead>
                            <tbody id="device-list">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header">
                    <h5 class="mb-0">Simulation Control</h5>
                </div>
                <div class="card-body">
                    <!-- File Upload -->
                    <div class="mb-3">
                        <label class="form-label" for="gpx-upload-input">Upload GPX</label>
                        <div class="input-group">
                            <input type="file" class="form-control d-none" id="gpx-upload-input" accept=".gpx">
                            <label for="gpx-upload-input" class="btn file-select-btn flex-grow-1 text-start rounded-start"
                                   style="cursor: pointer;">
                                <i class="bi bi-file-earmark-arrow-up me-2"></i>
                                <span id="gpx-upload-label">No file chosen</span>
                            </label>
                            <button class="btn btn-outline-primary rounded-end" type="button" id="upload-gpx-btn">
                                <span class="spinner-border spinner-border-sm d-none me-1" id="upload-gpx-spinner" role="status"></span>
                                Upload
                            </button>
                        </div>
                    </div>

                    <!-- Settings -->
                    <div class="mb-3">
                        <label class="form-label" for="gpx-select">Select Route <span id="file-count-badge" class="badge text-bg-secondary">0</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-map"></i></span>
                            <select class="form-select" id="gpx-select" aria-label="Select GPX route">
                                <option value="">-- Select a file --</option>
                            </select>
                            <button class="btn btn-outline-secondary" type="button" id="refresh-file-list-btn" title="Refresh" aria-label="Refresh file list">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                            <button class="btn btn-outline-danger" type="button" id="delete-file-btn" title="Delete" aria-label="Delete selected file"
                                    disabled>
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Route Metadata -->
                    <div id="route-metadata" class="mb-3 p-3 bg-light rounded border d-none">
                        <div class="row text-center">
                            <div class="col">
                                <div class="small text-muted">Distance</div>
                                <div class="meta-value" id="metadata-distance">-</div>
                            </div>
                            <div class="col">
                                <div class="small text-muted">Original Duration</div>
                                <div class="meta-value" id="metadata-duration">-</div>
                            </div>
                            <div class="col">
                                <div class="small text-muted">Points</div>
                                <div class="meta-value" id="metadata-points">-</div>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="target-duration-input">Target Duration (min)</label>
                            <input type="number" class="form-control" id="target-duration-input" step="0.1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="speed-multiplier-input">Speed Multiplier</label>
                            <input type="number" class="form-control" id="speed-multiplier-input" value="1.0"
                                   step="0.1" min="0.1">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="loop-checkbox">
                            <label class="form-check-label" for="loop-checkbox">Loop Track</label>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <button class="btn btn-success flex-grow-1" id="toggle-simulation-btn">Start</button>
                        <button class="btn btn-danger flex-grow-1" id="reset-simulation-btn" disabled>Reset</button>
                    </div>

                    <!-- Live Status -->
                    <div class="mt-4 p-3 bg-secondary bg-opacity-10 rounded">
                        <h6>Status: <span id="simulation-status" class="status-stopped">Idle</span></h6>
                        <div class="progress mb-2">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar"
                                 role="progressbar" style="width: 0%"></div>
                        </div>
                        <small class="text-muted" id="progress-text">0 / 0 points</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">Live Map</div>
                <div class="card-body p-0">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast container -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

<!-- Rename Modal -->
<div class="modal fade" id="rename-modal" tabindex="-1" aria-labelledby="rename-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="rename-modal-label">Rename Device</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="rename-modal-input">New Name</label>
        <input type="text" class="form-control" id="rename-modal-input" autocomplete="off">
        <input type="hidden" id="rename-modal-udid">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="rename-modal-confirm">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Modal (delete, etc.) -->
<div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirm-modal-label">Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="confirm-modal-body">Are you sure?</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-modal-confirm">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', path='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', path='vendor/leaflet/leaflet.js') }}"></script>
<script>
    window.TIANDITU_KEY = "{{ tianditu_key|e }}";
</script>
<script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
